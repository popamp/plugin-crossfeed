[package]
name = "popamp-plugin-crossfeed"
description = "Crossfeed for Popamp: stereo on headphones without the sound inside your head"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
authors = ["Gunyakov <web@gunyakov.pro>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/popamp/plugin-crossfeed"
publish = false

[lib]
# cdylib is the plug-in; rlib lets `cargo test` run its logic natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
extism-pdk = "1.4"
popamp-plugin-api = { git = "https://github.com/popamp/popamp-plugin-api", branch = "main" }

[profile.release]
# It runs on every block of sound: fast beats small.
opt-level = 3
lto = true
strip = true
